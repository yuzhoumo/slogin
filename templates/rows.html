{% for a in aliases %}
<tr data-alias-id="{{ a.id }}" data-pinned="{{ 'true' if a.pinned else 'false' }}">
  <td>
    <label class="toggle disabled" data-alias-id="{{ a.id }}" onclick="toggleAlias(this, {{ a.id }})">
      <input type="checkbox" {{ 'checked' if a.enabled }}>
      <span class="slider"></span>
      <span class="toggle-label">{{ "on" if a.enabled else "off" }}</span>
    </label>
  </td>
  <td class="email">
    <button class="pin-btn pin-disabled {{ 'pinned' if a.pinned }}" onclick="togglePin(this, {{ a.id }}, {{ 'false' if a.pinned else 'true' }})" title="{{ 'Unpin' if a.pinned else 'Pin' }}">
      {% if a.pinned %}
      <svg class="pin-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M15 9.34V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H7.89"/><path d="m2 2 20 20"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h11"/></svg>
      {% else %}
      <svg class="pin-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      {% endif %}
    </button>
    <span class="email-text" onclick="copyEmail(this)" title="Click to copy">{{ a.email }}</span>
  </td>
  <td class="note note-disabled" data-alias-id="{{ a.id }}" data-note="{{ a.note }}">
    <span class="note-text" onclick="startEdit(this)">{{ a.note }}</span>
    <span class="note-edit" style="display:none">
      <input type="text" class="note-input" value="{{ a.note }}"
             onkeydown="if(event.key==='Enter')saveNote(this);if(event.key==='Escape')cancelEdit(this);">
      <button class="note-btn save-btn" onclick="saveNote(this)" title="Save">✓</button>
      <button class="note-btn cancel-btn" onclick="cancelEdit(this)" title="Cancel">✗</button>
    </span>
  </td>
  <td class="ts" data-ts="{{ a.last_activity_ts or '' }}">{{ a.last_activity }}</td>
  <td class="ts" data-ts="{{ a.creation_ts or '' }}">{{ a.creation_date }}</td>
  <td class="actions">
    <button class="delete-btn pin-disabled" onclick="deleteAlias(this, {{ a.id }})" title="Delete">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </button>
  </td>
</tr>
{% endfor %}
