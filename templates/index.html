<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleLogin</title>
  <link rel="icon" href="https://app.simplelogin.io/static/favicon.ico" type="image/x-icon">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: #e0e0e0; background: #1a1a2e; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    h1 { font-size: 15px; font-weight: 600; color: #ccc; }
    .count { color: #888; font-size: 12px; }
    .refresh { background: none; border: 1px solid #444; color: #aaa; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 12px; }
    .refresh:hover { border-color: #888; color: #ddd; }
    .header-link { color: inherit; text-decoration: none; transition: color 0.2s; }
    .header-link:hover { color: #7fbbf0; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { text-align: left; color: #777; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 8px; border-bottom: 1px solid #333; cursor: pointer; user-select: none; }
    th:hover { color: #bbb; }
    th .arrow { font-size: 10px; margin-left: 4px; }
    td { padding: 5px 8px; border-bottom: 1px solid #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td.note { white-space: normal; max-width: 300px; color: #999; }
    tr:hover td { background: #222244; }
    .email { color: #7fbbf0; }
    .email-text { cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background 0.15s; }
    .email-text:hover { background: #333355; }
    .email-text.copied { background: #2a4a2a; transition: background 0s; }
    .on { color: #6bcf6b; }
    .off { color: #f06060; }
    .ts { color: #aaa; }
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #888; gap: 10px; }
    .loading .dots span { animation: blink 1.4s infinite both; }
    .loading .dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    tr.new { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Toggle switch */
    .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .toggle input { display: none; }
    .toggle .slider { position: relative; width: 32px; height: 18px; background: #f06060; border-radius: 9px; transition: background 0.2s; flex-shrink: 0; }
    .toggle .slider::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
    .toggle input:checked + .slider { background: #6bcf6b; }
    .toggle input:checked + .slider::after { transform: translateX(14px); }
    .toggle .toggle-label { font-size: 11px; min-width: 18px; }
    .toggle input:checked ~ .toggle-label { color: #6bcf6b; }
    .toggle input:not(:checked) ~ .toggle-label { color: #f06060; }
    .toggle.disabled { opacity: 0.4; pointer-events: none; }

    /* Inline note editing */
    td.note { position: relative; }
    td.note-disabled { opacity: 0.4; pointer-events: none; }
    .note-text { cursor: pointer; display: inline-block; min-width: 20px; min-height: 1em; }
    .note-text:hover { color: #ccc; }
    .note-edit { display: inline-flex; align-items: center; gap: 4px; width: 100%; }
    .note-input { background: #2a2a3e; border: 1px solid #555; color: #e0e0e0; font-family: inherit; font-size: 13px; padding: 2px 6px; border-radius: 3px; flex: 1; min-width: 0; }
    .note-input:focus { outline: none; border-color: #7fbbf0; }
    .note-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; line-height: 1; }
    .save-btn { color: #6bcf6b; }
    .save-btn:hover { color: #8f8; }
    .cancel-btn { color: #f06060; }
    .cancel-btn:hover { color: #f88; }
    /* Pin button */
    .pin-btn { background: none; border: none; cursor: pointer; color: #777; padding: 0 4px 0 0; vertical-align: middle; line-height: 1; }
    .pin-btn:hover { color: #ddd; }
    .pin-btn.pin-disabled { opacity: 0.4; pointer-events: none; }
    .pin-icon { vertical-align: middle; }

    /* Delete button */
    .actions { text-align: center; }
    .delete-btn { background: none; border: none; cursor: pointer; color: #666; padding: 2px; line-height: 1; vertical-align: middle; }
    .delete-btn:hover { color: #f06060; }
    .delete-btn.pin-disabled { opacity: 0.4; pointer-events: none; }

    /* Pinned section */
    .pinned-section { margin-bottom: 16px; }
    .pinned-section h2 { font-size: 12px; font-weight: 500; color: #999; margin-bottom: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
    .pinned-section table { border-left: 2px solid #7fbbf0; }
    .pinned-section .pin-btn { color: #7fbbf0; }
    .hidden { display: none; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .search-bar { margin-bottom: 12px; }
    #search-input { width: 100%; background: #2a2a3e; border: 1px solid #444; color: #e0e0e0; font-family: inherit; font-size: 13px; padding: 6px 10px; border-radius: 4px; }
    #search-input:focus { outline: none; border-color: #7fbbf0; }
    #search-input::placeholder { color: #666; }

    /* Create alias bar */
    .create-bar { display: flex; align-items: center; gap: 6px; }
    .create-input { background: #2a2a3e; border: 1px solid #444; color: #e0e0e0; font-family: inherit; font-size: 13px; padding: 4px 8px; border-radius: 3px; width: 180px; }
    .create-input:focus { outline: none; border-color: #7fbbf0; }
    .create-input::placeholder { color: #666; }
    .create-at { color: #777; font-size: 13px; }
    .create-select { background: #2a2a3e; border: 1px solid #444; color: #e0e0e0; font-family: inherit; font-size: 12px; padding: 4px 6px; border-radius: 3px; }
    .create-select:focus { outline: none; border-color: #7fbbf0; }
    .create-random-label { color: #aaa; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
    .create-btn { background: #2a4a2a; border: 1px solid #4a6a4a; color: #8f8; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 12px; white-space: nowrap; }
    .create-btn:hover { background: #3a5a3a; border-color: #6a8a6a; }
    .create-btn:disabled { opacity: 0.4; pointer-events: none; }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 6px;
      color: #e0e0e0;
      border: 1px solid #444;
      background: #2a2a3e;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-12px);
      animation: toastIn 0.25s ease forwards;
      max-width: 500px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.toast-error { border-color: #f06060; color: #f06060; }
    .toast.toast-success { border-color: #6bcf6b; color: #6bcf6b; }
    .toast.toast-info { border-color: #7fbbf0; color: #7fbbf0; }
    .toast.toast-out {
      animation: toastOut 0.3s ease forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-12px); }
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <header>
    <h1><a href="https://app.simplelogin.io/dashboard/setting" target="_blank" rel="noopener" class="header-link">SimpleLogin</a> <span class="count">({{ total }} aliases)</span></h1>
    <div class="header-right">
      <div class="create-bar" id="create-bar">
        <input type="text" id="create-prefix" placeholder="alias prefix" class="create-input">
        <span class="create-at">@</span>
        <select id="create-domain" class="create-select">
          <option value="">simplelogin (auto)</option>
        </select>
        <label class="create-random-label"><input type="checkbox" id="create-random" checked> random</label>
        <button class="create-btn" onclick="createAlias()" id="create-btn">+ Create</button>
      </div>
      <button class="refresh" onclick="startStream()">↻ Refresh</button>
    </div>
  </header>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search aliases…" oninput="fuzzyFilter(this.value)">
  </div>
  <div id="pinned-section" class="pinned-section hidden">
    <table id="pinned-table">
      <colgroup>
        <col style="width: 80px;">
        <col style="width: 35%;">
        <col>
        <col style="width: 170px;">
        <col style="width: 170px;">
        <col style="width: 40px;">
      </colgroup>
      <thead>
        <tr>
          <th data-col="0" onclick="sortTable('pinned-table', 0)">Status</th>
          <th data-col="1" onclick="sortTable('pinned-table', 1)">Alias</th>
          <th data-col="2" onclick="sortTable('pinned-table', 2)">Description</th>
          <th data-col="3" onclick="sortTable('pinned-table', 3)">Last Activity</th>
          <th data-col="4" onclick="sortTable('pinned-table', 4)">Created</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="pinned-body"></tbody>
    </table>
  </div>
  <table id="main-table">
    <colgroup>
      <col style="width: 80px;">
      <col style="width: 35%;">
      <col>
      <col style="width: 170px;">
      <col style="width: 170px;">
      <col style="width: 40px;">
    </colgroup>
    <thead>
      <tr>
        <th data-col="0" onclick="sortTable('main-table', 0)">Status</th>
        <th data-col="1" onclick="sortTable('main-table', 1)">Alias</th>
        <th data-col="2" onclick="sortTable('main-table', 2)">Description</th>
        <th data-col="3" onclick="sortTable('main-table', 3)">Last Activity</th>
        <th data-col="4" onclick="sortTable('main-table', 4)">Created</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="alias-body">
      <tr id="loader">
        <td colspan="6">
          <div class="loading">
            Loading aliases<span class="dots"><span>.</span><span>.</span><span>.</span></span>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <script>
    // Detect local timezone abbreviation
    var localTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var tzAbbr = new Date().toLocaleTimeString("en-US", {timeZoneName: "short"}).split(" ").pop();
    // Update time-based headers with timezone
    document.querySelectorAll("th[data-col='3']").forEach(function(th) {
      th.childNodes[0].textContent = "Last Activity (" + tzAbbr + ")";
    });
    document.querySelectorAll("th[data-col='4']").forEach(function(th) {
      th.childNodes[0].textContent = "Created (" + tzAbbr + ")";
    });

    function localizeTimestamps(container) {
      container.querySelectorAll("td.ts[data-ts]").forEach(function(td) {
        var ts = td.getAttribute("data-ts");
        if (!ts || td.getAttribute("data-localized")) return;
        var d = new Date(parseInt(ts) * 1000);
        var y = d.getFullYear();
        var mo = String(d.getMonth() + 1).padStart(2, "0");
        var da = String(d.getDate()).padStart(2, "0");
        var h = String(d.getHours()).padStart(2, "0");
        var mi = String(d.getMinutes()).padStart(2, "0");
        td.textContent = y + "-" + mo + "-" + da + " " + h + ":" + mi;
        td.setAttribute("data-localized", "1");
      });
    }

    function startStream() {
      var body = document.getElementById("alias-body");
      var pinnedBody = document.getElementById("pinned-body");
      var pinnedSection = document.getElementById("pinned-section");
      showToast("Refreshing aliases…", "info", 2000);

      // Only show loader if table is empty
      if (!body.children.length || body.querySelector("#loader")) {
        body.innerHTML = '<tr id="loader"><td colspan="6"><div class="loading">Loading aliases<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></td></tr>';
        document.querySelector(".count").textContent = "(… aliases)";
      }
      pinnedBody.innerHTML = "";
      pinnedSection.classList.add("hidden");

      var source = new EventSource("/aliases/stream");
      var first = true;
      var gotData = false;
      var prevBody = body.innerHTML;

      source.addEventListener("pinned", function(e) {
        gotData = true;
        pinnedBody.insertAdjacentHTML("beforeend", e.data);
        localizeTimestamps(pinnedBody);
        pinnedSection.classList.remove("hidden");
      });

      source.addEventListener("page", function(e) {
        gotData = true;
        if (first) {
          body.innerHTML = "";
          first = false;
        }
        body.insertAdjacentHTML("beforeend", e.data);
        localizeTimestamps(body);
      });

      source.addEventListener("ratelimit", function(e) {
        showToast("Rate limited: waiting " + parseFloat(e.data).toFixed(1) + "s", "info", 4000);
      });

      source.addEventListener("done", function(e) {
        document.querySelector(".count").textContent = "(" + e.data + " aliases)";
        source.close();
        // Enable all toggle switches now that loading is complete
        document.querySelectorAll(".toggle.disabled").forEach(function(el) {
          el.classList.remove("disabled");
        });
        // Enable inline editing on all note cells
        document.querySelectorAll("td.note-disabled").forEach(function(el) {
          el.classList.remove("note-disabled");
        });
        // Enable pin buttons
        document.querySelectorAll(".pin-btn.pin-disabled").forEach(function(el) {
          el.classList.remove("pin-disabled");
        });
        // Enable delete buttons
        document.querySelectorAll(".delete-btn.pin-disabled").forEach(function(el) {
          el.classList.remove("pin-disabled");
        });
        // Reset fuzzy search state
        document.getElementById("search-input").value = "";
        fuseInstance = null;
        // Fetch alias creation options
        loadAliasOptions();
      });

      source.onerror = function() {
        source.close();
        if (!gotData) {
          body.innerHTML = prevBody;
          showToast("Failed to load aliases: server unreachable", "error");
        }
      };
    }

    function copyEmail(el) {
      navigator.clipboard.writeText(el.textContent.trim());
      el.classList.add("copied");
      setTimeout(function() { el.classList.remove("copied"); }, 400);
    }

    function deleteAlias(btn, aliasId) {
      var row = btn.closest("tr");
      var email = row.querySelector(".email-text");
      if (!confirm("Delete " + (email ? email.textContent.trim() : "this alias") + "?")) return;
      btn.classList.add("pin-disabled");
      fetch("/api/alias/" + aliasId, { method: "DELETE" })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          row.style.transition = "opacity 0.3s";
          row.style.opacity = "0";
          setTimeout(function() {
            row.remove();
            // Hide pinned section if empty
            var pinnedBody = document.getElementById("pinned-body");
            if (!pinnedBody.children.length) {
              document.getElementById("pinned-section").classList.add("hidden");
            }
            // Update count
            var total = document.querySelectorAll("#pinned-body tr, #alias-body tr:not(#loader)").length;
            document.querySelector(".count").textContent = "(" + total + " aliases)";
          }, 300);
        })
        .catch(function() {
          btn.classList.remove("pin-disabled");
          showToast("Failed to delete alias: server error", "error");
        });
    }

    function toggleAlias(el, aliasId) {
      if (el.classList.contains("disabled")) return;
      el.classList.add("disabled");
      var checkbox = el.querySelector("input");
      var label = el.querySelector(".toggle-label");
      var wasChecked = checkbox.checked;

      fetch("/api/toggle/" + aliasId, { method: "POST" })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(data) {
          if (data.error) throw new Error(data.error);
          checkbox.checked = data.enabled;
          label.textContent = data.enabled ? "on" : "off";
        })
        .catch(function() {
          checkbox.checked = wasChecked;
          label.textContent = wasChecked ? "on" : "off";
          showToast("Failed to toggle alias: server error", "error");
        })
        .finally(function() {
          el.classList.remove("disabled");
        });
    }

    function togglePin(btn, aliasId, pinState) {
      btn.classList.add("pin-disabled");
      fetch("/api/alias/" + aliasId + "/pin", {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({pinned: pinState})
      }).then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        // Move the row between pinned and unpinned tables
        var row = btn.closest("tr");
        var pinnedBody = document.getElementById("pinned-body");
        var aliasBody = document.getElementById("alias-body");
        var pinnedSection = document.getElementById("pinned-section");

        if (pinState) {
          // Pin: move to pinned table
          row.setAttribute("data-pinned", "true");
          insertSorted(pinnedBody, row, "pinned-table");
          pinnedSection.classList.remove("hidden");
        } else {
          // Unpin: move to main table
          row.setAttribute("data-pinned", "false");
          insertSorted(aliasBody, row, "main-table");
          if (!pinnedBody.children.length) pinnedSection.classList.add("hidden");
        }

        // Update the button's onclick and icon
        var pinSvg = '<svg class="pin-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
        var unpinSvg = '<svg class="pin-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M15 9.34V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H7.89"/><path d="m2 2 20 20"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h11"/></svg>';
        btn.setAttribute("onclick", "togglePin(this, " + aliasId + ", " + !pinState + ")");
        btn.title = pinState ? "Unpin" : "Pin";
        btn.innerHTML = pinState ? unpinSvg : pinSvg;
      }).catch(function() {
        showToast("Failed to update pin: server error", "error");
      }).finally(function() {
        btn.classList.remove("pin-disabled");
      });
    }

    function closeAllEdits() {
      document.querySelectorAll(".note-edit").forEach(function(editSpan) {
        if (editSpan.style.display !== "none") {
          finishEdit(editSpan.closest("td.note"));
        }
      });
    }

    function startEdit(el) {
      closeAllEdits();
      var td = el.closest("td.note");
      td.querySelector(".note-text").style.display = "none";
      var editSpan = td.querySelector(".note-edit");
      editSpan.style.display = "";
      var input = td.querySelector(".note-input");
      input.value = td.getAttribute("data-note");
      input.focus();
      input.select();
    }

    function saveNote(el) {
      var td = el.closest("td.note");
      var aliasId = td.getAttribute("data-alias-id");
      var input = td.querySelector(".note-input");
      var newNote = input.value;

      fetch("/api/alias/" + aliasId + "/note", {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({note: newNote})
      }).then(function(resp) {
        if (!resp.ok) throw new Error("Save failed");
        td.setAttribute("data-note", newNote);
        td.querySelector(".note-text").textContent = newNote;
        finishEdit(td);
      }).catch(function() {
        showToast("Failed to save note: server error", "error");
      });
    }

    function cancelEdit(el) {
      var td = el.closest("td.note");
      finishEdit(td);
    }

    function finishEdit(td) {
      td.querySelector(".note-edit").style.display = "none";
      td.querySelector(".note-text").style.display = "";
    }

    // Click outside any open edit box cancels it
    document.addEventListener("mousedown", function(e) {
      if (!e.target.closest(".note-edit") && !e.target.classList.contains("note-text")) {
        closeAllEdits();
      }
    });

    var fuseInstance = null;

    function buildFuseIndex() {
      var allRows = Array.from(document.querySelectorAll("#pinned-body tr, #alias-body tr"));
      var items = allRows.map(function(row) {
        var emailTd = row.querySelector("td.email");
        var noteTd = row.querySelector("td.note");
        return {
          email: emailTd ? emailTd.textContent.trim() : "",
          note: noteTd ? (noteTd.getAttribute("data-note") || noteTd.textContent.trim()) : "",
          row: row
        };
      });
      fuseInstance = new Fuse(items, {
        keys: ["email", "note"],
        threshold: 0.4,
        ignoreLocation: true
      });
      return items;
    }

    function fuzzyFilter(query) {
      var allRows = Array.from(document.querySelectorAll("#pinned-body tr, #alias-body tr"));

      if (!query || !query.trim()) {
        allRows.forEach(function(row) { row.style.display = ""; });
        var pinnedBody = document.getElementById("pinned-body");
        var pinnedSection = document.getElementById("pinned-section");
        if (pinnedBody.children.length > 0) {
          pinnedSection.classList.remove("hidden");
        }
        return;
      }

      var items = buildFuseIndex();
      var results = fuseInstance.search(query);
      var matchedRows = new Set(results.map(function(r) { return r.item.row; }));

      allRows.forEach(function(row) {
        row.style.display = matchedRows.has(row) ? "" : "none";
      });

      var pinnedBody = document.getElementById("pinned-body");
      var pinnedSection = document.getElementById("pinned-section");
      var hasVisiblePinned = Array.from(pinnedBody.children).some(function(r) { return r.style.display !== "none"; });
      if (hasVisiblePinned) {
        pinnedSection.classList.remove("hidden");
      } else {
        pinnedSection.classList.add("hidden");
      }
    }

    var sortStates = {
      "pinned-table": { col: null, asc: true },
      "main-table": { col: null, asc: true }
    };

    function sortComparator(colIndex, asc) {
      return function(a, b) {
        var aText = (a.children[colIndex] ? a.children[colIndex].textContent : "").trim().toLowerCase();
        var bText = (b.children[colIndex] ? b.children[colIndex].textContent : "").trim().toLowerCase();
        if (colIndex === 3 || colIndex === 4) {
          var aVal = (aText === "—" || aText === "") ? "" : aText;
          var bVal = (bText === "—" || bText === "") ? "" : bText;
          if (aVal === "" && bVal === "") return 0;
          if (aVal === "") return asc ? -1 : 1;
          if (bVal === "") return asc ? 1 : -1;
          return asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
        }
        return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
      };
    }

    function sortBody(tbody, state) {
      if (state.col === null) return;
      var rows = Array.from(tbody.querySelectorAll("tr:not(#loader)"));
      if (!rows.length) return;
      rows.sort(sortComparator(state.col, state.asc));
      rows.forEach(function(row) { tbody.appendChild(row); });
    }

    function insertSorted(tbody, row, tableId) {
      var state = sortStates[tableId];
      if (!state || state.col === null) {
        tbody.appendChild(row);
        return;
      }
      var cmp = sortComparator(state.col, state.asc);
      var existing = Array.from(tbody.querySelectorAll("tr:not(#loader)"));
      var inserted = false;
      for (var i = 0; i < existing.length; i++) {
        if (cmp(row, existing[i]) < 0) {
          tbody.insertBefore(row, existing[i]);
          inserted = true;
          break;
        }
      }
      if (!inserted) tbody.appendChild(row);
    }

    function sortTable(tableId, colIndex) {
      var state = sortStates[tableId];
      if (state.col === colIndex) {
        state.asc = !state.asc;
      } else {
        state.col = colIndex;
        state.asc = true;
      }

      var table = document.getElementById(tableId);
      sortBody(table.querySelector("tbody"), state);

      // Update arrow indicators for this table only
      table.querySelectorAll("thead th").forEach(function(th) {
        var existing = th.querySelector(".arrow");
        if (existing) existing.remove();
        if (parseInt(th.getAttribute("data-col")) === colIndex) {
          var arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = state.asc ? " ▲" : " ▼";
          th.appendChild(arrow);
        }
      });
    }

    // --- Alias Creation ---
    var aliasOptions = null;

    function loadAliasOptions() {
      fetch("/api/alias/options").then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function(data) {
        aliasOptions = data;
        var select = document.getElementById("create-domain");
        select.innerHTML = '<option value="">simplelogin (auto)</option>';
        var suffixes = data.suffixes || [];
        var customDomains = {};
        suffixes.forEach(function(s) {
          if (s.is_custom) {
            // Extract domain from suffix like ".something@domain.com" → "domain.com"
            var domain = s.suffix.split("@")[1];
            if (!customDomains[domain]) {
              customDomains[domain] = s;
              var opt = document.createElement("option");
              opt.value = domain;
              opt.textContent = domain;
              select.appendChild(opt);
            }
          }
        });
        document.getElementById("create-btn").disabled = false;
      }).catch(function() {
        showToast("Failed to load alias creation options", "error");
      });
    }

    function randAlphanumeric(n) {
      var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
      var result = "";
      for (var i = 0; i < n; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
      return result;
    }

    function showToast(text, type, timeout) {
      type = type || "info";
      timeout = timeout || 3500;
      var container = document.getElementById("toast-container");
      var el = document.createElement("div");
      el.className = "toast toast-" + type;
      el.textContent = text;
      container.appendChild(el);
      setTimeout(function() {
        el.classList.add("toast-out");
        el.addEventListener("animationend", function() { el.remove(); });
      }, timeout);
    }

    function findSuffix(domain) {
      // Find signed suffix for a specific custom domain
      var suffixes = (aliasOptions && aliasOptions.suffixes) || [];
      for (var i = 0; i < suffixes.length; i++) {
        if (suffixes[i].is_custom && suffixes[i].suffix.split("@")[1] === domain) {
          return suffixes[i];
        }
      }
      return null;
    }

    function findDefaultSuffix() {
      var suffixes = (aliasOptions && aliasOptions.suffixes) || [];
      // Prefer simplelogin.com, fallback to slmail.me, then shortest non-custom
      var slcom = null, slmail = null;
      for (var i = 0; i < suffixes.length; i++) {
        if (suffixes[i].is_custom) continue;
        if (suffixes[i].suffix.indexOf("@simplelogin.com") !== -1) slcom = suffixes[i];
        if (suffixes[i].suffix.indexOf("@slmail.me") !== -1) slmail = suffixes[i];
      }
      return slcom || slmail || findShortestNonCustomSuffix();
    }

    function findShortestNonCustomSuffix() {
      var suffixes = (aliasOptions && aliasOptions.suffixes) || [];
      var best = null;
      for (var i = 0; i < suffixes.length; i++) {
        if (!suffixes[i].is_custom && (!best || suffixes[i].suffix.length < best.suffix.length)) {
          best = suffixes[i];
        }
      }
      return best;
    }

    function createAlias() {
      if (!aliasOptions) return;
      var prefix = document.getElementById("create-prefix").value.trim();
      var domain = document.getElementById("create-domain").value;
      var random = document.getElementById("create-random").checked;
      var btn = document.getElementById("create-btn");
      var body;

      // Case 7: nothing to create
      if (!prefix && !random) {
        showToast("Cannot create alias: enter a prefix or enable random", "error");
        return;
      }

      // Case 1: random, no text, no custom domain → uuid random
      if (random && !prefix && !domain) {
        body = { random_uuid: true };
      } else {
        var suffix, finalPrefix;

        if (domain) {
          suffix = findSuffix(domain);
          if (!suffix) { showToast("Cannot create alias: no suffix found for selected domain", "error"); return; }

          if (random && prefix) {
            // Case 4: text + random + custom domain
            finalPrefix = prefix + "." + randAlphanumeric(8);
          } else if (random && !prefix) {
            // Case 5: random + custom domain, no text
            finalPrefix = randAlphanumeric(8);
          } else {
            // Case 3: text + custom domain, no random
            finalPrefix = prefix;
          }
        } else {
          // No custom domain selected — use slmail.me for exact, shortest for random
          if (random) {
            suffix = findShortestNonCustomSuffix();
          } else {
            suffix = findDefaultSuffix();
          }
          if (!suffix) { showToast("Cannot create alias: no domain suffix available", "error"); return; }
          // Cases 2 & 6: text + shortest non-custom suffix
          finalPrefix = prefix;
        }

        body = {
          prefix: finalPrefix,
          signed_suffix: suffix.signed_suffix,
          mailbox_ids: [aliasOptions.default_mailbox_id],
        };
      }

      btn.disabled = true;
      showToast("Creating alias…", "info", 2500);

      fetch("/api/alias/create", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      }).then(function(r) {
        return r.json().then(function(data) { return {status: r.status, data: data}; });
      }).then(function(result) {
        if (result.status >= 400) {
          throw new Error(result.data.error || "Creation failed");
        }
        showToast("Alias created: " + result.data.email, "success");
        document.getElementById("create-prefix").value = "";
        // Refresh to show the new alias
        startStream();
      }).catch(function(err) {
        showToast("Failed to create alias: " + err.message, "error");
      }).finally(function() {
        btn.disabled = false;
      });
    }

    // Allow Enter key in prefix input to create
    document.getElementById("create-prefix").addEventListener("keydown", function(e) {
      if (e.key === "Enter") createAlias();
    });

    startStream();
  </script>
</body>
</html>
