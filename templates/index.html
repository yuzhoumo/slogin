<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleLogin</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/js/ufuzzy.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <header>
    <h1><a href="https://app.simplelogin.io/dashboard/setting" target="_blank" rel="noopener" class="header-link">SimpleLogin</a> <span class="count">({{ total }} aliases)</span> <span class="stats"></span></h1>
    <div class="header-right">
      <div class="create-bar" id="create-bar">
        <div class="create-input-group">
          <input type="text" id="create-prefix" placeholder="alias prefix" class="create-input">
          <div class="create-input-sep"></div>
          <label class="create-random-label"><input type="checkbox" id="create-random"> random</label>
        </div>
        <span class="create-at">@</span>
        <select id="create-domain" class="create-select"></select>
        <button class="create-btn" onclick="createAlias()" id="create-btn">+ Create</button>
      </div>
      <button class="refresh" onclick="startStream()">↻ Refresh</button>
    </div>
  </header>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search aliases…" oninput="fuzzyFilter(this.value)">
  </div>
  <main class="content-scroll">
    <div id="pinned-section" class="pinned-section hidden">
      <table id="pinned-table">
        <colgroup>
          <col style="width: 80px;">
          <col style="width: 35%;">
          <col style="width: 200px;">
          <col style="width: 170px;">
          <col style="width: 170px;">
          <col style="width: 40px;">
        </colgroup>
        <thead>
          <tr>
            <th data-col="0" onclick="sortTable('pinned-table', 0)">Status</th>
            <th data-col="1" onclick="sortTable('pinned-table', 1)">Alias</th>
            <th data-col="2" onclick="sortTable('pinned-table', 2)">Description</th>
            <th data-col="3" onclick="sortTable('pinned-table', 3)">Last Activity</th>
            <th data-col="4" onclick="sortTable('pinned-table', 4)">Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="pinned-body"></tbody>
      </table>
    </div>
    <table id="main-table">
      <colgroup>
        <col style="width: 80px;">
        <col style="width: 35%;">
        <col style="width: 200px;">
        <col style="width: 170px;">
        <col style="width: 170px;">
        <col style="width: 40px;">
      </colgroup>
      <thead>
        <tr>
          <th data-col="0" onclick="sortTable('main-table', 0)">Status</th>
          <th data-col="1" onclick="sortTable('main-table', 1)">Alias</th>
          <th data-col="2" onclick="sortTable('main-table', 2)">Description</th>
          <th data-col="3" onclick="sortTable('main-table', 3)">Last Activity</th>
          <th data-col="4" onclick="sortTable('main-table', 4)">Created</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="alias-body">
        <tr id="loader">
          <td colspan="6">
            <div class="loading">
              Loading aliases<span class="dots"><span>.</span><span>.</span><span>.</span></span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
